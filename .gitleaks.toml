# Konfigurasi gitleaks (CI). Semua aturan bawaan tetap aktif.
[extend]
useDefault = true

[allowlist]
description = "Nilai dummy khusus CI/test — bukan rahasia sungguhan"
# Hanya nilai PERSIS ini yang dikecualikan (bukan seluruh file ci.yml).
regexes = [
  '''ci-secret-yang-panjangnya-lebih-dari-32-karakter''',
  # Positif palsu `generic-api-key` di docs/decisions.md (catatan keputusan editor teks, 2026-10-23): kalimat
  # "Uji penolakan API dari sesi admin: tautan/gambar/H1/kunci tak dikenal/..." terbaca sebagai `api … : <nilai>`.
  '''tautan/gambar/H1/kunci''',
  # Positif palsu `generic-api-key` di scripts/test-pii.ts: kunci PII rusak buatan (blok 16 hex berulang) untuk menguji bahwa
  # piiKeysProblem MENOLAK kunci berentropi rendah (SEC-166) — bukan kunci sungguhan.
  # Allowlist dicocokkan ke nilai yang tertangkap (regexTarget bawaan = secret), jadi hanya string persis ini.
  '''^0123456789abcdef$''',
]

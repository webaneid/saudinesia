# docker-compose.prod.yml
# Dipakai DI SERVER, bukan dibuild di sana — image ditarik dari GHCR (dibuild workflow, lihat docs/deployment.md).
# Jalan di server:
#   docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy up -d
# (.env.deploy berisi GITHUB_REPO & IMAGE_TAG, ditulis oleh langkah deploy.) docker-compose.yml (tanpa .prod)
# adalah bentuk awal/dev yang MEMBANGUN image di mesin sendiri dan membuka port — jangan dipakai di production.
#
# Pola mengikuti smart-ai (docker-compose.prod.yml), disesuaikan: satu app Next.js (bukan api+web+worker), Redis
# (rate limit auth), GOWA self-host (layanan `gowa`, docs/rencana-gowa-self-host.md). Dua peran database (SEC-303): pemilik skema
# `saudinesia` (POSTGRES_USER, hanya kontainer migrate) dan `saudinesia_app` (DML saja, dipakai web).
#
# RESOURCE LIMITS: tanpa batas, satu container yang bocor/spike menghabiskan RAM dan memicu OOM-kill container
# LAIN (termasuk postgres — data berisiko). Angka di bawah titik awal untuk VPS ±4 GB — sesuaikan dengan
# `docker stats` setelah live.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Hardening kontainer (SEC-10). no-new-privileges: proses tak bisa menaikkan hak lewat setuid/setgid biner.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # SATU replika saja: cron (auto-cancel, reminder, kurs) jalan di dalam proses lewat node-cron di
  # instrumentation.ts. Lebih dari satu replika = tiap job berjalan ganda (booking dibatalkan/diingatkan dua kali).
  web:
    image: ghcr.io/${GITHUB_REPO:?GITHUB_REPO belum diisi}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    # POSTGRES_PASSWORD hanya dibutuhkan kontainer postgres (+ tertanam di DATABASE_URL); `environment` mengalahkan `env_file`, jadi nilainya
    # DIKOSONGKAN di sini — satu salinan rahasia DB yang tak perlu terbaca proses web yang dihadapkan ke internet (SEC-10).
    # Begitu pula sandi/URL peran PEMILIK (MIGRATE_DATABASE_URL) dan APP_DB_PASSWORD: web hanya memegang DATABASE_URL peran aplikasi
    # `saudinesia_app` (DML saja, bukan pemilik — tak bisa mematikan trigger append-only; SEC-303).
    environment:
      POSTGRES_PASSWORD: ""
      MIGRATE_DATABASE_URL: ""
      APP_DB_PASSWORD: ""
      # Kredensial ROOT MinIO hanya untuk kontainer minio & minio-setup; web memakai user aplikasi berpolicy satu bucket (SEC-305).
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      # Wajib: middleware memisahkan host admin dan host app (docs/rencana-domain-admin.md).
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN belum diisi}
      TZ: UTC
    <<: *hardening
    # Non-root (user `bun`) dan tak butuh capability apa pun — port 3000 bukan port istimewa.
    cap_drop: [ALL]
    # Sistem file image read-only (SEC-10): proses yang dibobol tak bisa mengganti kode aplikasi atau menaruh berkas. Aplikasi tidak menulis
    # berkas (unggahan → MinIO, log → stdout); hanya cache Next dan /tmp yang boleh ditulis, di memori (uid 1000 = user `bun` image oven/bun).
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:uid=1000,gid=1000,mode=0700,size=64m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"] # image bun-slim tanpa curl/wget
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]
    # Tidak ada "ports:" — hanya Caddy yang menjangkaunya lewat jaringan internal.
    mem_limit: 1g
    cpus: 1.0
    logging: *logging

  # Migrasi skema, sekali jalan tiap deploy (`prisma migrate deploy` — TIDAK PERNAH `db push` di production).
  # Image terpisah karena CLI Prisma tidak ikut ke image web. Berjalan sebagai PEMILIK skema (MIGRATE_DATABASE_URL), lalu membuat/memperbarui
  # peran aplikasi `saudinesia_app` (prisma/apply-app-role.ts) — satu-satunya kontainer yang memegang kredensial pemilik.
  migrate:
    image: ghcr.io/${GITHUB_REPO:?GITHUB_REPO belum diisi}/migrate:${IMAGE_TAG:-latest}
    restart: "no"
    # HANYA URL pemilik + sandi peran aplikasi — kontainer ini tak butuh JWT_SECRET/GOOGLE_CLIENT_SECRET/RESEND_API_KEY/token GOWA (minimum hak; SEC-10).
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?MIGRATE_DATABASE_URL belum diisi}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD belum diisi}
    <<: *hardening
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  postgres:
    image: postgres:19-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    restart: unless-stopped
    environment:
      POSTGRES_DB: saudinesia
      POSTGRES_USER: saudinesia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diisi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    <<: *hardening
    # Entrypoint resmi mulai sebagai root: memperbaiki kepemilikan direktori data lalu turun ke user `postgres` (gosu). Hanya hak itu yang diberi.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saudinesia -d saudinesia"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]
    # Sengaja TIDAK ada "ports:" — DB hanya terjangkau dari jaringan internal. Akses manual (DBeaver, dll.)
    # lewat SSH tunnel, jangan buka port ke internet.
    # Postgres paling penting diberi RAM cukup (integritas data) — limit paling longgar di antara service.
    mem_limit: 1g
    cpus: 1.0
    logging: *logging

  # Rate limit auth (lib/auth/rateLimit.ts). Data berumur pendek: kehilangannya hanya mengosongkan hitungan (ada fallback memori).
  # Berpassword (SEC-10): jaringan internal bukan batas keamanan — kontainer lain yang terkompromi tak boleh bisa menguras/menghapus
  # hitungan rate limit. REDIS_PASSWORD yang sama harus ada di REDIS_URL (redis://:<password>@redis:6379) di .env.production.
  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD belum diisi}"]
    volumes:
      - redis_data:/data
    <<: *hardening
    # Entrypoint resmi: root → perbaiki kepemilikan /data → turun ke user `redis`.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    networks: [internal]
    mem_limit: 192m
    cpus: 0.25
    logging: *logging

  minio:
    # MinIO tidak lagi menerbitkan image publik → image buatan sendiri (infra/minio, workflow minio-image.yml).
    # Workflow itu WAJIB dijalankan sekali sebelum deploy pertama. Tag = <MINIO_VERSION>-r<IMAGE_REV> dari ARG di infra/minio/Dockerfile.
    image: ghcr.io/${GITHUB_REPO:?GITHUB_REPO belum diisi}/minio:RELEASE.2025-10-15T17-29-55Z-r3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # ROOT — BUKAN kunci yang dipakai web (MINIO_ACCESS_KEY/SECRET_KEY = user aplikasi, dibuat minio-setup; SEC-305).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER belum diisi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD belum diisi}
      # Harus sama dengan region bucket & tanda tangan presigned di lib/storage/minio.ts (BUCKET_REGION).
      MINIO_SITE_REGION: ap-southeast-1
    volumes:
      - minio_data:/data
    <<: *hardening
    # Image buatan sendiri berjalan non-root (user `minio`) di port > 1024 — tak butuh capability apa pun (SEC-10; dibuktikan job CI docker).
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || exit 1"] # alpine: wget busybox
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # Console (:9001) sengaja tidak diekspos. Bila perlu, lewat SSH tunnel atau route Caddy dengan auth tambahan.
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  # Penyiapan MinIO sekali jalan tiap deploy (infra/minio/setup.sh, SEC-305): bucket ada & privat, policy `saudinesia-app` (hanya bucket
  # itu), user aplikasi = MINIO_ACCESS_KEY/SECRET_KEY. Satu-satunya kontainer selain minio yang memegang root. Web menunggu ini selesai.
  minio-setup:
    image: ghcr.io/${GITHUB_REPO:?GITHUB_REPO belum diisi}/minio:RELEASE.2025-10-15T17-29-55Z-r3
    restart: "no"
    entrypoint: ["/usr/local/bin/minio-setup"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER belum diisi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD belum diisi}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY belum diisi}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY belum diisi}
      MINIO_BUCKET: ${MINIO_BUCKET:-saudinesia-docs}
      MINIO_SITE_REGION: ap-southeast-1
    <<: *hardening
    cap_drop: [ALL]
    depends_on:
      minio:
        condition: service_healthy
    networks: [internal]
    # 128m terbukti kurang di produksi: `mc admin` di-OOM-kill (deploy pertama 2026-11-21). Sekali jalan, jadi longgar.
    mem_limit: 256m
    cpus: 0.25
    logging: *logging

  # WhatsApp gateway (GOWA v9, docs/rencana-gowa-self-host.md) — SELF-HOST, menggantikan Sumopod. Hanya jaringan internal, TANPA `ports:`:
  # web memanggilnya di http://gowa:3000 (Basic auth), QR diambil web di server lalu dikirim ke admin sebagai gambar — GOWA tak pernah publik.
  # Pesan masuk (verifikasi `VERIF`, ADR-0002) → webhook web lewat jaringan internal, ditandatangani HMAC WHATSAPP_WEBHOOK_SECRET.
  # Sesi WhatsApp di volume gowa_data — SENGAJA tidak ikut backup (K4): sesi = kunci akun WhatsApp bisnis; server hilang → scan QR ulang.
  # Tidak memakai env_file: hanya variabel di bawah yang sampai ke GOWA (tak memegang rahasia DB/JWT/PII; SEC-10).
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.9.0@sha256:8a668eee5b4e41cd636f53cc5f2e6e566a0c2670960bb6162fc662e6dc33e7ad
    restart: unless-stopped
    command: ["rest"]
    environment:
      APP_PORT: "3000"
      APP_BASIC_AUTH: ${WA_GATEWAY_USER:?WA_GATEWAY_USER belum diisi}:${WA_GATEWAY_PASSWORD:?WA_GATEWAY_PASSWORD belum diisi}
      # Nama yang tampil di HP: WhatsApp → Perangkat tertaut.
      APP_OS: Saudinesia
      # Dasbor web GOWA (diunduh dari GitHub saat jalan) dan MCP dimatikan: tak dipakai, dan unduhan kode saat jalan = rantai pasok.
      APP_UI_ENABLED: "false"
      APP_UI_AUTO_UPDATE: "false"
      MCP_ENABLED: "false"
      WHATSAPP_WEBHOOK: http://web:3000/api/v1/webhooks/whatsapp
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:?WHATSAPP_WEBHOOK_SECRET belum diisi}
      WHATSAPP_WEBHOOK_EVENTS: message
      WHATSAPP_WEBHOOK_IGNORE_JIDS: "@g.us,@newsletter"
      WHATSAPP_WEBHOOK_INCLUDE_OUTGOING: "false"
      # Tidak membalas/membaca otomatis, tidak mengunduh media, tidak menyimpan isi chat (data pribadi jamaah tak menumpuk di GOWA).
      WHATSAPP_AUTO_REPLY: ""
      WHATSAPP_AUTO_MARK_READ: "false"
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: "false"
      WHATSAPP_CHAT_STORAGE: "false"
      TZ: UTC
    volumes:
      - gowa_data:/app/storages
    <<: *hardening
    # Entrypoint image: root → buat/chown storages & statics → turun ke gowauser (su-exec). Hanya hak itu yang diberi.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp:size=32m
      # Gambar QR & berkas kirim sementara — tak perlu bertahan.
      - /app/statics:size=32m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/health || exit 1"] # alpine: wget busybox; /health publik (tanpa auth)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5
    logging: *logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # Domain dibaca Caddyfile lewat {$APP_DOMAIN}/{$ADMIN_DOMAIN}/{$FILES_DOMAIN} — tidak ada domain yang dikeraskan di repo.
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN belum diisi}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN belum diisi}
      FILES_DOMAIN: ${FILES_DOMAIN:?FILES_DOMAIN belum diisi}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # sertifikat TLS — jangan dihapus (rate limit Let's Encrypt)
      - caddy_config:/config
    depends_on: [web, minio]
    <<: *hardening
    # Image resmi berjalan sebagai root di dalam kontainer; satu-satunya hak yang perlu = bind port 80/443 (SEC-10; dibuktikan job CI docker).
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [internal]
    mem_limit: 128m
    cpus: 0.25
    logging: *logging

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  gowa_data:

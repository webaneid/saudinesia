# docker-compose.yml — bentuk AWAL/dev: membangun image di mesin sendiri, membuka port aplikasi (3001) dan console
# MinIO (9001), dan memakai minio/minio:latest (image publik yang sudah tidak diterbitkan lagi).
# JANGAN dipakai di production → docker-compose.prod.yml (image dari GHCR, tanpa port terbuka, + Caddy). Lihat docs/deployment.md.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://saudinesia:${POSTGRES_PASSWORD}@postgres:5432/saudinesia
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - snd

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saudinesia
      POSTGRES_USER: saudinesia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saudinesia"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - snd

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - snd

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"    # console only — 9000 is internal to the snd network
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - snd

networks:
  snd:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

name: MinIO Image

# MinIO tidak lagi menerbitkan image publik, jadi image dibangun sendiri dari tag sumber (infra/minio/Dockerfile).
# Dibangun SEKALI per versi (manual, atau saat infra/minio berubah) — bukan tiap rilis aplikasi.
# WAJIB dijalankan sebelum deploy pertama: docker-compose.prod.yml menarik ghcr.io/<repo>/minio:<versi>.
# Pola sama dengan smart-ai (.github/workflows/minio-image.yml).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [infra/minio/**]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Nama image GHCR wajib huruf kecil.
      - name: Nama image huruf kecil
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Versi MinIO dari Dockerfile
        run: echo "MINIO_VERSION=$(sed -n 's/^ARG MINIO_VERSION=//p' infra/minio/Dockerfile)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: infra/minio
          push: true
          tags: ghcr.io/${{ env.IMAGE_REPO }}/minio:${{ env.MINIO_VERSION }}

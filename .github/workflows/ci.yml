name: CI

# Jalan di TIAP pull request ke main — masalah ketahuan SEBELUM merge, bukan sesudah.
# Pola mengikuti smart-ai (.github/workflows/ci.yml), disesuaikan stack Saudinesia:
# satu app Next.js + Prisma (bukan monorepo), tanpa ESLint config & tanpa test suite (belum ada).
on:
  pull_request:
    branches: [main]
  # Dipakai ulang sebagai gate oleh workflow rilis nanti (lihat docs/deployment.md).
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    # Token CI hanya-baca. gitleaks butuh membaca daftar commit PR (pull-requests: read).
    permissions:
      contents: read
      pull-requests: read
    # DB sekali pakai untuk memeriksa migrasi (bukan mock) — dibuang bersama runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saudinesia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # Redis sungguhan untuk menguji rate limiter (lib/auth/rateLimit.ts, skrip Lua atomik) — SEC-04.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saudinesia_ci
      # Nilai dummy khusus CI (bukan rahasia) — hanya agar `next build` tidak berhenti karena env kosong.
      JWT_SECRET: ci-secret-yang-panjangnya-lebih-dari-32-karakter
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks memindai seluruh commit PR

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Type check
        run: bun run typecheck

      # Gagal bila schema.prisma berubah tanpa migrasi (production memakai `migrate deploy`, bukan `db push`).
      - name: Migrations apply from scratch and match schema.prisma
        run: |
          bunx prisma migrate deploy
          bunx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      # Rate limiter (SEC-04): memori, Redis mati, dan Redis SUNGGUHAN. Uji Redis membaca kunci lewat klien terpisah
      # supaya fallback ke memori yang diam-diam tidak lolos sebagai "hijau".
      #
      # Notifikasi (email Resend + WhatsApp): klien, template, dan notify() terhadap DB sungguhan + gateway PALSU lokal —
      # log harus jujur (sent | failed | skipped). test-notify menolak jalan kecuali nama DB memuat test/_ci/tmp (saudinesia_ci lolos).
      - name: Uji rate limiter & notifikasi
        run: REDIS_TEST_URL=redis://localhost:6379 bun run test

      - name: Build
        run: bun run build

      # Security check SOP (CLAUDE.md): Critical memblokir; high/moderate hanya peringatan sampai register temuan
      # (docs/lessons-learned.md SEC-05) dibereskan — setelah itu naikkan ke --audit-level=high.
      - name: Dependency audit - Critical memblokir
        run: bun audit --audit-level=critical

      - name: Dependency audit - ringkasan (peringatan, tidak memblokir)
        run: bun audit
        continue-on-error: true

      - name: Secret scan (lapis kedua, independen dari hook Claude Code)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # komentar PR butuh izin tulis — hasil cukup di log CI

  # Membuktikan jalur production TANPA server: Dockerfile (2 target), docker-compose.prod.yml, Caddyfile, skrip env,
  # dan smoke test aplikasi sungguhan (migrasi → web → /api/v1/health menyentuh DB). Docker tidak ada di mesin dev
  # (lihat docs/deployment.md), jadi inilah satu-satunya tempat jalur ini diuji.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Nama image lokal mengikuti pola GHCR yang dipakai compose (ghcr.io/<repo>/<service>:<tag>).
      # Sengaja bukan nama GITHUB_* (awalan itu dicadangkan Actions) — di server nilainya ada di .env.deploy.
      IMG_REPO: ci/saudinesia
      IMG_TAG: ci
    steps:
      - uses: actions/checkout@v7

      - name: Buat .env.production dengan skrip produksi (sekaligus menguji skripnya)
        run: |
          bash scripts/buat-env-production.sh ci.example.test files.ci.example.test .
          test -s .env.production
          # Sama seperti langkah deploy di server
          printf 'GITHUB_REPO=%s\nIMAGE_TAG=%s\n' "$IMG_REPO" "$IMG_TAG" > .env.deploy

      - name: Validasi docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy config --quiet

      - name: Validasi Caddyfile
        run: |
          docker run --rm \
            -e APP_DOMAIN=ci.example.test -e FILES_DOMAIN=files.ci.example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build image web (target runner) dan migrate
        run: |
          docker build -t "ghcr.io/$IMG_REPO/web:$IMG_TAG" --target runner .
          docker build -t "ghcr.io/$IMG_REPO/migrate:$IMG_TAG" --target migrate .

      - name: Image web - tanpa rahasia/dokumentasi, dan bukan root
        run: |
          IMG="ghcr.io/$IMG_REPO/web:$IMG_TAG"
          ! docker run --rm --entrypoint sh "$IMG" -c 'ls -A /app | grep -E "^\.env|^docs$|^\.git$|^\.claude$"' || { echo "image web berisi berkas terlarang"; exit 1; }
          test "$(docker run --rm --entrypoint id "$IMG" -u)" != "0" || { echo "image web berjalan sebagai root"; exit 1; }
          # Seed pengembangan (SEC-27) tidak boleh ada di image mana pun — image migrate membawa DATABASE_URL produksi.
          for I in "ghcr.io/$IMG_REPO/web:$IMG_TAG" "ghcr.io/$IMG_REPO/migrate:$IMG_TAG"; do
            # Bentuk POSITIF (test ! -e ... && test ! -e ...): galat `docker run` sendiri (exit 125-127) ikut menggagalkan langkah, bukan dianggap lolos.
            docker run --rm --entrypoint sh "$I" -c 'test ! -e /app/prisma/seed.ts && test ! -e /app/prisma/seedGuard.ts' || { echo "seed ada di image $I (atau docker run gagal)"; exit 1; }
          done

      # Hanya layanan yang tidak butuh image GHCR eksternal: MinIO buatan sendiri baru ada setelah minio-image.yml
      # dijalankan, jadi di sini tidak dinyalakan (web hanya menyentuh MinIO saat unggah/preview; presign offline).
      - name: Smoke — postgres, redis, migrate, web
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          $C up -d postgres redis
          # --exit-code-from: langkah gagal bila migrasi gagal (tanpa ini `up` selalu keluar 0)
          $C up --exit-code-from migrate migrate
          # web bergantung pada minio (healthy) di compose production; di CI minio dilewati dengan --no-deps
          $C up -d --no-deps web
          for i in $(seq 1 40); do
            if $C exec -T web bun -e "fetch('http://localhost:3000/api/v1/health').then(async (r) => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1) }, () => process.exit(1))"; then
              echo "web sehat setelah ~$((i*3))s"; OK=1; break
            fi
            sleep 3
          done
          [ "${OK:-0}" = "1" ] || { echo "web tidak sehat"; exit 1; }
          # Halaman publik yang membaca DB harus 200 (bukan 500) pada DB kosong hasil migrasi
          for path in /id /id/hotels /id/login; do
            $C exec -T web bun -e "fetch('http://localhost:3000$path').then((r) => { console.log('$path', r.status); process.exit(r.status === 200 ? 0 : 1) })"
          done
          # Log tidak boleh memuat kegagalan klasik image: engine Prisma/openssl, modul hilang
          if $C logs web | grep -E "PrismaClientInitializationError|libssl|Cannot find module|Unable to require"; then
            echo "log web memuat error fatal"; exit 1
          fi

      # Skrip superadmin pertama dijalankan DI DALAM image web (bukan di runner): membuktikan skripnya ikut ke image dan
      # hanya butuh @prisma/client + Bun, lalu login sungguhan lewat route aplikasi dengan akun yang baru dibuat.
      - name: Smoke - superadmin pertama lalu login
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          PW='Ci-Admin!2345'
          printf '%s\n' "$PW" | $C exec -T web bun scripts/create-superadmin.ts --email ci-admin@example.test --name "CI Admin" --password-stdin
          # Kedua kalinya HARUS ditolak (sudah ada superadmin) — penjaga terhadap akun berhak-tinggi ganda.
          if printf '%s\n' "$PW" | $C exec -T web bun scripts/create-superadmin.ts --email lain@example.test --name Lain --password-stdin; then
            echo "skrip seharusnya menolak superadmin kedua"; exit 1
          fi
          $C exec -T -e PW="$PW" web bun -e "fetch('http://localhost:3000/api/v1/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: 'ci-admin@example.test', password: process.env.PW }) }).then(async (r) => { const j = await r.json(); console.log(r.status, JSON.stringify(j)); process.exit(r.status === 200 && j.data?.role === 'superadmin' ? 0 : 1) })"

      # Invoice PDF di image produksi (`bun server.js`): upgrade dependency pernah lulus `next build` dan dev tetapi invoice gagal 500 di
      # produksi (modul pembuat PDF tak termuat oleh Bun). Hanya uji pada artefak produksi yang menangkap kelas regresi ini (SEC-05).
      - name: Smoke - invoice PDF di image produksi
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          $C cp scripts/ci-invoice-smoke.ts web:/app/scripts/ci-invoice-smoke.ts
          $C exec -T -e CI_SMOKE=1 web bun scripts/ci-invoice-smoke.ts

      # Rate limit login (SEC-04) di image produksi dengan Redis nyata: 5 gagal diizinkan, ke-6 harus 429, dan kuncinya
      # harus benar-benar ada di Redis (bukan fallback memori).
      - name: Smoke - rate limit login di image produksi (Redis)
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          attempt() {
            $C exec -T web bun -e "fetch('http://localhost:3000/api/v1/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Forwarded-For': '198.51.100.7' }, body: JSON.stringify({ email: 'rl-ci@example.test', password: 'salah' }) }).then((r) => console.log(r.status))"
          }
          for i in 1 2 3 4 5; do
            code=$(attempt)
            [ "$code" = "401" ] || { echo "percobaan $i: harap 401, dapat $code"; exit 1; }
          done
          code=$(attempt)
          [ "$code" = "429" ] || { echo "percobaan ke-6: harap 429, dapat $code"; exit 1; }
          # Redis berpassword (SEC-10): redis-cli membaca sandi dari REDISCLI_AUTH.
          RPW="$(grep '^REDIS_PASSWORD=' .env.production | cut -d= -f2-)"
          $C exec -T -e REDISCLI_AUTH="$RPW" redis redis-cli --scan --pattern 'rl:*' | tee /tmp/rl-keys.txt
          grep -q 'rl:loginAcctIp:' /tmp/rl-keys.txt || { echo "kunci rate limit TIDAK ada di Redis — limiter jatuh ke memori"; exit 1; }

      # Hardening kontainer (SEC-10) dibuktikan pada kontainer yang BENAR-BENAR jalan, bukan hanya pada berkas compose.
      - name: Smoke - hardening kontainer (no-new-privileges, cap_drop, Redis berpassword, rahasia DB tak ada di web)
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          for SVC in web postgres redis; do
            ID="$($C ps -q $SVC)"; test -n "$ID" || { echo "kontainer $SVC tidak ditemukan"; exit 1; }
            docker inspect -f '{{.HostConfig.SecurityOpt}}' "$ID" | grep -q 'no-new-privileges' || { echo "$SVC tanpa no-new-privileges"; exit 1; }
            docker inspect -f '{{.HostConfig.CapDrop}}' "$ID" | grep -q 'ALL' || { echo "$SVC tanpa cap_drop ALL"; exit 1; }
          done
          # Redis menolak klien tanpa sandi, menerima dengan sandi
          OUT="$($C exec -T redis redis-cli ping 2>&1 || true)"
          echo "$OUT" | grep -q NOAUTH || { echo "Redis menerima klien tanpa sandi: $OUT"; exit 1; }
          RPW="$(grep '^REDIS_PASSWORD=' .env.production | cut -d= -f2-)"
          test "$($C exec -T -e REDISCLI_AUTH="$RPW" redis redis-cli ping)" = "PONG" || { echo "Redis menolak sandi yang benar"; exit 1; }
          # Rahasia database tidak boleh terbaca proses web (DATABASE_URL tetap ada karena aplikasi memerlukannya)
          test -z "$($C exec -T web printenv POSTGRES_PASSWORD)" || { echo "POSTGRES_PASSWORD terbaca di kontainer web"; exit 1; }
          $C exec -T web printenv DATABASE_URL > /dev/null || { echo "DATABASE_URL hilang dari web"; exit 1; }

      # Auth email + Google di image produksi (tanpa kredensial Resend/Google — itu justru kondisi yang harus aman): pendaftaran & lupa password
      # membalas seragam, tautan/token tak terbaca dari respons, rute OTP lama sudah tidak ada, Google mati dengan sopan, dan pengaman callback
      # (state/cookie) menolak. Pengaman yang hanya hidup di rute ini tidak tercakup uji skrip — ini penutupnya.
      - name: Smoke - auth email dan Google di image produksi
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          $C exec -T web bun -e "
            const base = 'http://localhost:3000/api/v1/auth'
            const post = (path, body) => fetch(base + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
            const get = (path) => fetch(base + path, { redirect: 'manual' })
            const fail = (m) => { console.log('GAGAL:', m); process.exit(1) }
            const reg = { fullName: 'Uji CI', email: 'ci-daftar@example.test', phone: '628111222333', whatsapp: '628111222333', locale: 'id' }
            let r = await post('/register', reg); let j = await r.json()
            if (r.status !== 200 || JSON.stringify(j) !== '{\"success\":true,\"data\":{\"sent\":true}}') fail('register harus {sent:true}, dapat ' + r.status + JSON.stringify(j))
            r = await post('/register', { ...reg, password: 'x' }); if (r.status !== 400) fail('register menerima field password: ' + r.status)
            r = await post('/forgot-password', { email: 'tidak-ada@example.test' }); j = await r.json()
            if (r.status !== 200 || j.data?.sent !== true) fail('forgot-password harus seragam: ' + r.status)
            r = await post('/registration/preview', { token: 'x'.repeat(43) }); if (r.status !== 404) fail('preview token ngawur harus 404: ' + r.status)
            r = await post('/registration/complete', { token: 'x'.repeat(43), password: 'Sandi-Kuat1!', privacyConsent: true, whatsappConsent: true }); if (r.status !== 401) fail('complete token ngawur harus 401: ' + r.status)
            for (const p of ['/verify-phone', '/verify-reset-otp']) { r = await post(p, {}); if (r.status !== 404) fail(p + ' seharusnya sudah tidak ada: ' + r.status) }
            r = await get('/google/start?locale=id'); if (r.status !== 307 || !(r.headers.get('location') ?? '').includes('error=google_unavailable')) fail('google/start tanpa kredensial: ' + r.status + ' ' + r.headers.get('location'))
            r = await get('/google/callback?code=x&state=y'); if (r.status !== 307 || !(r.headers.get('location') ?? '').includes('error=google_failed')) fail('google/callback tanpa cookie state: ' + r.status + ' ' + r.headers.get('location'))
            r = await post('/google/complete', { fullName: 'Uji CI', privacyConsent: true }); if (r.status !== 401) fail('google/complete tanpa cookie harus 401: ' + r.status)
            r = await fetch('http://localhost:3000/id/login'); const html = await r.text(); if (html.includes('Masuk dengan Google')) fail('tombol Google tampil tanpa kredensial')
            r = await fetch(base + '/contact', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: '628111222333', whatsapp: '628111222333', whatsappConsent: true }) })
            if (r.status !== 401) fail('PUT /auth/contact tanpa sesi harus 401: ' + r.status)
            r = await fetch('http://localhost:3000/api/v1/bookings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
            if (r.status !== 401) fail('POST /bookings tanpa sesi harus 401: ' + r.status)
            r = await fetch('http://localhost:3000/id/lengkapi-data', { redirect: 'manual' }); if (r.status !== 307 || !(r.headers.get('location') ?? '').includes('/id/login')) fail('lengkapi-data tanpa sesi harus ke login: ' + r.status)
            // Webhook WhatsApp (verifikasi nomor): publik, satu-satunya penjaga = tanda tangan HMAC.
            const wh = 'http://localhost:3000/api/v1/webhooks/whatsapp'
            const secret = process.env.WHATSAPP_WEBHOOK_SECRET
            if (!secret) fail('WHATSAPP_WEBHOOK_SECRET tidak ada di container web (skrip env harus membuatnya)')
            const { createHmac } = await import('node:crypto')
            const sign = (b, s) => 'sha256=' + createHmac('sha256', s).update(b).digest('hex')
            const msg = JSON.stringify({ event: 'message', payload: { id: 'x', chat_id: '628111222333@s.whatsapp.net', from: '628111222333@s.whatsapp.net', is_from_me: false, body: 'halo' } })
            r = await fetch(wh, { method: 'POST', body: msg }); if (r.status !== 401) fail('webhook tanpa tanda tangan harus 401: ' + r.status)
            r = await fetch(wh, { method: 'POST', body: msg, headers: { 'X-Hub-Signature-256': sign(msg, 'secret-salah') } }); if (r.status !== 401) fail('webhook tanda tangan salah harus 401: ' + r.status)
            r = await fetch(wh, { method: 'POST', body: msg + ' ', headers: { 'X-Hub-Signature-256': sign(msg, secret) } }); if (r.status !== 401) fail('webhook body diubah setelah ditandatangani harus 401: ' + r.status)
            r = await fetch(wh, { method: 'POST', body: msg, headers: { 'X-Hub-Signature-256': sign(msg, secret) } }); j = await r.json()
            if (r.status !== 200 || j.data?.handled !== false) fail('webhook sah, pesan biasa: harus 200 handled=false, dapat ' + r.status + JSON.stringify(j))
            const ver = JSON.stringify({ event: 'message', payload: { id: 'y', chat_id: '628111222333@s.whatsapp.net', from: '628111222333@s.whatsapp.net', is_from_me: false, body: 'VERIF AAAAAAAA' } })
            r = await fetch(wh, { method: 'POST', body: ver, headers: { 'X-Hub-Signature-256': sign(ver, secret) } }); j = await r.json()
            if (r.status !== 200 || j.data?.handled !== false) fail('kode verifikasi tak dikenal harus 200 handled=false: ' + r.status + JSON.stringify(j))
            r = await fetch('http://localhost:3000/api/v1/auth/whatsapp/verification', { method: 'POST' }); if (r.status !== 401) fail('POST whatsapp/verification tanpa sesi harus 401: ' + r.status)
            console.log('OK: auth email + Google + webhook WhatsApp aman di image produksi')
          "

      - name: Log layanan (hanya bila gagal)
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy logs --no-color --tail=120

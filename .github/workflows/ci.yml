name: CI

# Jalan di TIAP pull request ke main — masalah ketahuan SEBELUM merge, bukan sesudah.
# Pola mengikuti smart-ai (.github/workflows/ci.yml), disesuaikan stack Saudinesia:
# satu app Next.js + Prisma (bukan monorepo), tanpa ESLint config & tanpa test suite (belum ada).
on:
  pull_request:
    branches: [main]
  # Dipakai ulang sebagai gate oleh workflow rilis nanti (lihat docs/deployment.md).
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    # Token CI hanya-baca. gitleaks butuh membaca daftar commit PR (pull-requests: read).
    permissions:
      contents: read
      pull-requests: read
    # DB sekali pakai untuk memeriksa migrasi (bukan mock) — dibuang bersama runner.
    services:
      postgres:
        image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saudinesia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # Redis sungguhan untuk menguji rate limiter (lib/auth/rateLimit.ts, skrip Lua atomik) — SEC-04.
      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saudinesia_ci
      # Nilai dummy khusus CI (bukan rahasia) — hanya agar `next build` tidak berhenti karena env kosong.
      JWT_SECRET: ci-secret-yang-panjangnya-lebih-dari-32-karakter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks memindai seluruh commit PR

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11 # pin; naikkan sengaja bersama Dockerfile (oven/bun)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Type check
        run: bun run typecheck

      # Gagal bila schema.prisma berubah tanpa migrasi (production memakai `migrate deploy`, bukan `db push`).
      - name: Migrations apply from scratch and match schema.prisma
        run: |
          bunx prisma migrate deploy
          bunx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      # Rate limiter (SEC-04): memori, Redis mati, dan Redis SUNGGUHAN. Uji Redis membaca kunci lewat klien terpisah
      # supaya fallback ke memori yang diam-diam tidak lolos sebagai "hijau".
      #
      # Notifikasi (email Resend + WhatsApp): klien, template, dan notify() terhadap DB sungguhan + gateway PALSU lokal —
      # log harus jujur (sent | failed | skipped). test-notify menolak jalan kecuali nama DB memuat test/_ci/tmp (saudinesia_ci lolos).
      - name: Uji rate limiter & notifikasi
        run: REDIS_TEST_URL=redis://localhost:6379 bun run test

      - name: Build
        run: bun run build

      # Security check SOP (CLAUDE.md): Critical memblokir; high/moderate hanya peringatan sampai register temuan
      # (docs/lessons-learned.md SEC-05) dibereskan — setelah itu naikkan ke --audit-level=high.
      - name: Dependency audit - Critical memblokir
        run: bun audit --audit-level=critical

      - name: Dependency audit - ringkasan (peringatan, tidak memblokir)
        run: bun audit
        continue-on-error: true

      - name: Secret scan (lapis kedua, independen dari hook Claude Code)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # komentar PR butuh izin tulis — hasil cukup di log CI

  # Membuktikan jalur production TANPA server: Dockerfile (2 target), docker-compose.prod.yml, Caddyfile, skrip env,
  # dan smoke test aplikasi sungguhan (migrasi → web → /api/v1/health menyentuh DB). Docker tidak ada di mesin dev
  # (lihat docs/deployment.md), jadi inilah satu-satunya tempat jalur ini diuji.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Nama image lokal mengikuti pola GHCR yang dipakai compose (ghcr.io/<repo>/<service>:<tag>).
      # Sengaja bukan nama GITHUB_* (awalan itu dicadangkan Actions) — di server nilainya ada di .env.deploy.
      IMG_REPO: ci/saudinesia
      IMG_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Buat .env.production dengan skrip produksi (sekaligus menguji skripnya)
        run: |
          bash scripts/buat-env-production.sh ci.example.test admin.ci.example.test files.ci.example.test .
          test -s .env.production
          # Sama seperti langkah deploy di server
          printf 'GITHUB_REPO=%s\nIMAGE_TAG=%s\n' "$IMG_REPO" "$IMG_TAG" > .env.deploy

      - name: Validasi docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy config --quiet

      - name: Validasi Caddyfile
        run: |
          docker run --rm \
            -e APP_DOMAIN=ci.example.test -e ADMIN_DOMAIN=admin.ci.example.test -e FILES_DOMAIN=files.ci.example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b caddy validate --config /etc/caddy/Caddyfile

      # Batas body sungguhan (SEC-211, scripts/test-body-limit.ts mengunci isinya): Caddyfile production di depan "web" palsu
      # yang membaca seluruh body. JSON > 1 MB ditolak, unggahan 2 MB lolos, unggahan > 8 MB ditolak, `..` tak meminjam 8 MB.
      - name: Uji batas body Caddy
        run: |
          docker network create bodylimit
          docker run -d --name web --network bodylimit python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89 python -c "
          import http.server as h
          class H(h.BaseHTTPRequestHandler):
              def do_POST(s):
                  s.rfile.read(int(s.headers.get('Content-Length') or 0)); s.send_response(200); s.end_headers(); s.wfile.write(b'ok')
              do_PATCH = do_POST
          h.HTTPServer(('', 3000), H).serve_forever()"
          docker run -d --name edge --network bodylimit -p 8080:8080 \
            -e APP_DOMAIN=http://app.test:8080 -e ADMIN_DOMAIN=http://admin.test:8080 -e FILES_DOMAIN=http://files.test:8081 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
          head -c 2000000 /dev/zero > 2mb; head -c 9000000 /dev/zero > 9mb; head -c 500000 /dev/zero > small
          H=app.test
          code() { curl -s -o /dev/null -w '%{http_code}' -H "Host: $H" -X POST --data-binary "@$2" "http://localhost:8080$1"; }
          # Tunggu sampai Caddy DAN upstream siap (200 lewat proxy) — 502 berarti upstream belum hidup, bukan hasil uji.
          for i in $(seq 1 60); do test "$(code /api/v1/bookings small)" = 200 && break; sleep 1; done
          expect() { got=$(code "$2" "$3"); echo "$1 $2 ($3) -> $got"; test "$got" = "$1"; }
          expect 200 /api/v1/bookings small
          expect 413 /api/v1/bookings 2mb
          expect 200 /api/v1/bookings/cm9x/payment/bukti 2mb
          expect 200 /api/v1/account/pilgrims/cm9x/documents 2mb
          expect 413 /api/v1/bookings/cm9x/payment/bukti 9mb
          expect 413 /api/v1/account/pilgrims/..%2F..%2Fbookings/documents 2mb
          # Pemisahan host (docs/rencana-domain-admin.md): admin & API admin tidak ada di host app (404, juga huruf besar/garis ganda)...
          expect 404 /api/v1/admin/bookings small
          expect 404 /API/v1//admin/bookings small
          expect 404 /admin small
          expect 404 /id/admin/bookings small
          expect 404 /EN//Admin small
          expect 200 /api/v1/administrasi small
          # ...alur jamaah/webhook tidak ada di host admin; batas body sama di host admin.
          H=admin.test
          expect 404 /api/v1/auth/register small
          expect 404 /api/v1/auth/google/start small
          expect 404 /api/v1/webhooks/ipaymu small
          expect 200 /api/v1/admin/bookings small
          expect 200 /api/v1/auth/login small
          expect 413 /api/v1/admin/bookings/x/revise 2mb
          expect 200 /api/v1/admin/media/hotel/cm9x 2mb
          expect 200 /api/v1/admin/customers/cm9x/pilgrims/cm9y/documents 2mb
          got=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: admin.test' -X PATCH --data-binary @2mb http://localhost:8080/api/v1/admin/media/hotel/cm9x)
          echo "PATCH media 2mb -> $got"; test "$got" = 413
          got=$(curl -s -D - -o /dev/null -H 'Host: admin.test' -X POST --data-binary @small http://localhost:8080/api/v1/admin/bookings | tr -d '\r' | grep -i '^x-robots-tag:')
          echo "$got"; echo "$got" | grep -qi 'noindex'

      - name: Build image web (target runner) dan migrate
        run: |
          docker build -t "ghcr.io/$IMG_REPO/web:$IMG_TAG" --target runner .
          docker build -t "ghcr.io/$IMG_REPO/migrate:$IMG_TAG" --target migrate .

      # Image MinIO dibangun di sini dengan tag yang SAMA dengan compose (di server ditarik dari GHCR, dibangun workflow MinIO Image) —
      # sekaligus membuktikan Dockerfile-nya (basis dipin digest, mc) bisa dibangun.
      - name: Build image MinIO (tag sama dengan compose)
        run: |
          TAG="$(sed -n 's/^ARG MINIO_VERSION=//p' infra/minio/Dockerfile)-r$(sed -n 's/^ARG IMAGE_REV=//p' infra/minio/Dockerfile)"
          docker build -t "ghcr.io/$IMG_REPO/minio:$TAG" infra/minio

      - name: Image web - tanpa rahasia/dokumentasi, dan bukan root
        run: |
          IMG="ghcr.io/$IMG_REPO/web:$IMG_TAG"
          ! docker run --rm --entrypoint sh "$IMG" -c 'ls -A /app | grep -E "^\.env|^docs$|^\.git$|^\.claude$"' || { echo "image web berisi berkas terlarang"; exit 1; }
          test "$(docker run --rm --entrypoint id "$IMG" -u)" != "0" || { echo "image web berjalan sebagai root"; exit 1; }
          # Seed pengembangan (SEC-27) tidak boleh ada di image mana pun — image migrate membawa DATABASE_URL produksi.
          for I in "ghcr.io/$IMG_REPO/web:$IMG_TAG" "ghcr.io/$IMG_REPO/migrate:$IMG_TAG"; do
            # Bentuk POSITIF (test ! -e ... && test ! -e ...): galat `docker run` sendiri (exit 125-127) ikut menggagalkan langkah, bukan dianggap lolos.
            docker run --rm --entrypoint sh "$I" -c 'test ! -e /app/prisma/seed.ts && test ! -e /app/prisma/seedGuard.ts' || { echo "seed ada di image $I (atau docker run gagal)"; exit 1; }
          done

      # Hanya layanan yang tidak butuh image GHCR eksternal: MinIO buatan sendiri baru ada setelah minio-image.yml
      # dijalankan, jadi di sini tidak dinyalakan (web hanya menyentuh MinIO saat unggah/preview; presign offline).
      - name: Smoke — postgres, redis, migrate, web
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          $C up -d postgres redis
          # --exit-code-from: langkah gagal bila migrasi gagal (tanpa ini `up` selalu keluar 0)
          $C up --exit-code-from migrate migrate
          # web bergantung pada minio (healthy) di compose production; di CI minio dilewati dengan --no-deps
          $C up -d --no-deps web
          for i in $(seq 1 40); do
            if $C exec -T web bun -e "fetch('http://localhost:3000/api/v1/health').then(async (r) => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1) }, () => process.exit(1))"; then
              echo "web sehat setelah ~$((i*3))s"; OK=1; break
            fi
            sleep 3
          done
          [ "${OK:-0}" = "1" ] || { echo "web tidak sehat"; exit 1; }
          # Halaman publik yang membaca DB tidak boleh 500 pada DB kosong hasil migrasi. Katalog tanpa produk aktif = 404 (F7,
          # lib/catalog/availability.ts) — sekaligus membuktikan gerbang itu jalan di image produksi.
          for check in /id:200 /id/login:200 /id/hotels:404; do
            path=${check%%:*}; want=${check##*:}
            $C exec -T web bun -e "fetch('http://localhost:3000$path').then((r) => { console.log('$path', r.status, 'harap $want'); process.exit(r.status === $want ? 0 : 1) })"
          done
          # Log tidak boleh memuat kegagalan klasik image: engine Prisma/openssl, modul hilang
          if $C logs web | grep -E "PrismaClientInitializationError|libssl|Cannot find module|Unable to require"; then
            echo "log web memuat error fatal"; exit 1
          fi

      # Skrip superadmin pertama dijalankan DI DALAM image web (bukan di runner): membuktikan skripnya ikut ke image dan
      # hanya butuh @prisma/client + Bun, lalu login sungguhan lewat route aplikasi dengan akun yang baru dibuat.
      - name: Smoke - superadmin pertama lalu login
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          PW='Ci-Admin!2345'
          printf '%s\n' "$PW" | $C exec -T web bun scripts/create-superadmin.ts --email ci-admin@example.test --name "CI Admin" --password-stdin
          # Kedua kalinya HARUS ditolak (sudah ada superadmin) — penjaga terhadap akun berhak-tinggi ganda.
          if printf '%s\n' "$PW" | $C exec -T web bun scripts/create-superadmin.ts --email lain@example.test --name Lain --password-stdin; then
            echo "skrip seharusnya menolak superadmin kedua"; exit 1
          fi
          $C exec -T -e PW="$PW" web bun -e "fetch('http://localhost:3000/api/v1/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json', Host: 'admin.ci.example.test' }, body: JSON.stringify({ email: 'ci-admin@example.test', password: process.env.PW }) }).then(async (r) => { const j = await r.json(); console.log(r.status, JSON.stringify(j)); process.exit(r.status === 200 && j.data?.role === 'superadmin' ? 0 : 1) })"
          # Domain admin terpisah di artefak PRODUKSI (middleware Edge membaca ADMIN_DOMAIN saat jalan, bukan saat build): staf ditolak di host app
          # (K2), halaman admin 404 di host app (K3), host admin me-rewrite alamat ramah / mengalihkan jalur lama (K4).
          $C exec -T -e PW="$PW" web bun -e "
            const go = (host, path, init = {}) => fetch('http://localhost:3000' + path, { redirect: 'manual', ...init, headers: { Host: host, ...(init.headers || {}) } })
            const A = 'admin.ci.example.test', P = 'ci.example.test'
            const login = await go(P, '/api/v1/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: 'ci-admin@example.test', password: process.env.PW }) })
            const checks = [
              ['login staf di host app', login.status, 403],
              ['/id/admin di host app', (await go(P, '/id/admin')).status, 404],
              ['/api/v1/admin di host app', (await go(P, '/api/v1/admin/bookings')).status, 404],
              ['/bookings di host admin tanpa sesi', (await go(A, '/bookings')).headers.get('location')?.replace(/^https?:[/][/][^/]+/, ''), '/login'],
              ['/login di host admin', (await go(A, '/login')).status, 200],
              ['jalur lama di host admin', (await go(A, '/id/admin/bookings')).status, 308],
              ['/id di host admin', (await go(A, '/id')).status, 404],
            ]
            let bad = 0
            for (const [n, got, want] of checks) { console.log(n, '->', got); if (got !== want) bad++ }
            process.exit(bad ? 1 : 0)"
          # Penanda Platform Provider (docs/arsitektur-bagi-hasil.md §3) juga hanya lewat skrip DI DALAM image: tetapkan, ulang = tak berubah,
          # akun bukan superadmin ditolak.
          $C exec -T web bun scripts/set-platform-provider.ts ci-admin@example.test
          $C exec -T web bun scripts/set-platform-provider.ts ci-admin@example.test | grep -q 'Tidak berubah'
          if $C exec -T web bun scripts/set-platform-provider.ts tak-ada@example.test; then
            echo "skrip seharusnya menolak akun yang tak ada"; exit 1
          fi

      # Invoice PDF di image produksi (`bun server.js`): upgrade dependency pernah lulus `next build` dan dev tetapi invoice gagal 500 di
      # produksi (modul pembuat PDF tak termuat oleh Bun). Hanya uji pada artefak produksi yang menangkap kelas regresi ini (SEC-05).
      - name: Smoke - invoice PDF di image produksi
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          # Web read-only (SEC-10): skrip tak bisa disalin ke kontainer yang berjalan — dipasang (bind mount, baca saja) ke kontainer sekali jalan
          # dari image yang sama, yang memanggil web sungguhan lewat jaringan internal.
          $C run --rm --no-deps -T -v "$PWD/scripts/ci-invoice-smoke.ts:/app/scripts/ci-invoice-smoke.ts:ro" \
            -e CI_SMOKE=1 -e BASE_URL=http://web:3000 -e SMOKE_HOST=admin.ci.example.test web bun scripts/ci-invoice-smoke.ts

      # Rate limit login (SEC-04) di image produksi dengan Redis nyata: 5 gagal diizinkan, ke-6 harus 429, dan kuncinya
      # harus benar-benar ada di Redis (bukan fallback memori).
      - name: Smoke - rate limit login di image produksi (Redis)
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          attempt() {
            $C exec -T web bun -e "fetch('http://localhost:3000/api/v1/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Forwarded-For': '198.51.100.7' }, body: JSON.stringify({ email: 'rl-ci@example.test', password: 'salah' }) }).then((r) => console.log(r.status))"
          }
          for i in 1 2 3 4 5; do
            code=$(attempt)
            [ "$code" = "401" ] || { echo "percobaan $i: harap 401, dapat $code"; exit 1; }
          done
          code=$(attempt)
          [ "$code" = "429" ] || { echo "percobaan ke-6: harap 429, dapat $code"; exit 1; }
          # Redis berpassword (SEC-10): redis-cli membaca sandi dari REDISCLI_AUTH.
          RPW="$(grep '^REDIS_PASSWORD=' .env.production | cut -d= -f2-)"
          $C exec -T -e REDISCLI_AUTH="$RPW" redis redis-cli --scan --pattern 'rl:*' | tee /tmp/rl-keys.txt
          # Cukup SATU kunci login di Redis untuk membuktikan limiter image produksi memakai Redis. Jangan mensyaratkan kunci tertentu:
          # perintah Redis yang melewati commandTimeout 300 ms (runner CI sibuk) membuat limiter sengaja jatuh ke memori 10 dtk, sehingga
          # kunci lapis lain bisa hanya ada di memori (CI #174 gagal acak: hanya rl:loginIp yang tertulis; 429 tetap benar).
          grep -qE '^rl:login(AcctIp|Ip|Acct):' /tmp/rl-keys.txt || { echo "kunci rate limit TIDAK ada di Redis — limiter jatuh ke memori"; exit 1; }

      # Hardening kontainer (SEC-10) dibuktikan pada kontainer yang BENAR-BENAR jalan, bukan hanya pada berkas compose.
      - name: Smoke - hardening kontainer (no-new-privileges, cap_drop, Redis berpassword, rahasia DB tak ada di web, peran DB aplikasi)
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          for SVC in web postgres redis; do
            ID="$($C ps -q $SVC)"; test -n "$ID" || { echo "kontainer $SVC tidak ditemukan"; exit 1; }
            docker inspect -f '{{.HostConfig.SecurityOpt}}' "$ID" | grep -q 'no-new-privileges' || { echo "$SVC tanpa no-new-privileges"; exit 1; }
            docker inspect -f '{{.HostConfig.CapDrop}}' "$ID" | grep -q 'ALL' || { echo "$SVC tanpa cap_drop ALL"; exit 1; }
          done
          # Redis menolak klien tanpa sandi, menerima dengan sandi
          OUT="$($C exec -T redis redis-cli ping 2>&1 || true)"
          echo "$OUT" | grep -q NOAUTH || { echo "Redis menerima klien tanpa sandi: $OUT"; exit 1; }
          RPW="$(grep '^REDIS_PASSWORD=' .env.production | cut -d= -f2-)"
          test "$($C exec -T -e REDISCLI_AUTH="$RPW" redis redis-cli ping)" = "PONG" || { echo "Redis menolak sandi yang benar"; exit 1; }
          # Rahasia database tidak boleh terbaca proses web (DATABASE_URL tetap ada karena aplikasi memerlukannya)
          test -z "$($C exec -T web printenv POSTGRES_PASSWORD)" || { echo "POSTGRES_PASSWORD terbaca di kontainer web"; exit 1; }
          $C exec -T web printenv DATABASE_URL > /dev/null || { echo "DATABASE_URL hilang dari web"; exit 1; }
          # Peran database (SEC-303): web memakai `saudinesia_app` (bukan superuser, bukan pemilik) dan tak memegang kredensial pemilik.
          for K in MIGRATE_DATABASE_URL APP_DB_PASSWORD; do test -z "$($C exec -T web printenv $K)" || { echo "$K terbaca di kontainer web"; exit 1; }; done
          $C exec -T web printenv DATABASE_URL | grep -q '^postgresql://saudinesia_app:' || { echo "web tidak memakai peran saudinesia_app"; exit 1; }
          test "$($C exec -T postgres psql -U saudinesia -d saudinesia -tAc "select rolsuper::text || (select count(*) from pg_class where relowner = r.oid) from pg_roles r where rolname = 'saudinesia_app'")" = "false0" || { echo "saudinesia_app superuser/pemilik"; exit 1; }
          # Koneksi sungguhan aplikasi = saudinesia_app, dan peran itu tak bisa mematikan trigger buku kas.
          test "$($C exec -T postgres psql -U saudinesia -d saudinesia -tAc "select count(*) > 0 from pg_stat_activity where usename = 'saudinesia_app'")" = "t" || { echo "tak ada koneksi web sebagai saudinesia_app"; exit 1; }
          if $C exec -T postgres psql -U saudinesia_app -d saudinesia -v ON_ERROR_STOP=1 -c 'ALTER TABLE cash_entries DISABLE TRIGGER ALL'; then echo "saudinesia_app bisa mematikan trigger"; exit 1; fi

      # Auth email + Google di image produksi (tanpa kredensial Resend/Google — itu justru kondisi yang harus aman): pendaftaran & lupa password
      # membalas seragam, tautan/token tak terbaca dari respons, rute OTP lama sudah tidak ada, Google mati dengan sopan, dan pengaman callback
      # (state/cookie) menolak. Pengaman yang hanya hidup di rute ini tidak tercakup uji skrip — ini penutupnya.
      # SEC-10 (sisa) + SEC-305: MinIO & Caddy berjalan dengan hak minimal, user MinIO aplikasi hanya punya satu bucket, web read-only.
      - name: Smoke - MinIO user aplikasi, Caddy hak minimal, web read-only
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          # Penyiapan sekali jalan (menyalakan minio lebih dulu lewat depends_on healthy); dua kali = idempoten.
          $C run --rm minio-setup
          $C run --rm minio-setup
          ID="$($C ps -q minio)"; test -n "$ID" || { echo "minio tidak berjalan"; exit 1; }
          docker inspect -f '{{.HostConfig.CapDrop}}' "$ID" | grep -q ALL || { echo "minio tanpa cap_drop ALL"; exit 1; }
          docker inspect -f '{{.HostConfig.SecurityOpt}}' "$ID" | grep -q no-new-privileges || { echo "minio tanpa no-new-privileges"; exit 1; }
          # User aplikasi: tulis/baca/hapus objek boleh; menjadikan publik, hapus bucket, akses admin DITOLAK.
          $C run --rm --no-deps --entrypoint sh minio-setup -c '
            set -e; export MC_CONFIG_DIR=/tmp/mc MC_HOST_app="http://$MINIO_ACCESS_KEY:$MINIO_SECRET_KEY@minio:9000"
            echo halo > /tmp/f
            mc --quiet cp /tmp/f "app/$MINIO_BUCKET/ci/f.txt"; mc --quiet cat "app/$MINIO_BUCKET/ci/f.txt" | grep -q halo; mc --quiet rm "app/$MINIO_BUCKET/ci/f.txt"
            if mc --quiet anonymous set download "app/$MINIO_BUCKET"; then echo "user aplikasi bisa menjadikan bucket publik"; exit 1; fi
            if mc --quiet rb --force "app/$MINIO_BUCKET"; then echo "user aplikasi bisa menghapus bucket"; exit 1; fi
            if mc --quiet admin user list app; then echo "user aplikasi punya akses admin"; exit 1; fi
            echo "user aplikasi MinIO terbatas: OK"'
          # Web tak memegang root MinIO, dan klien MinIO aplikasi (kredensial web) menjangkau bucket.
          for K in MINIO_ROOT_USER MINIO_ROOT_PASSWORD; do test -z "$($C exec -T web printenv $K)" || { echo "$K terbaca di kontainer web"; exit 1; }; done
          $C exec -T web bun -e "const M = require('minio'); new M.Client({ endPoint: process.env.MINIO_ENDPOINT, port: Number(process.env.MINIO_PORT), useSSL: false, accessKey: process.env.MINIO_ACCESS_KEY, secretKey: process.env.MINIO_SECRET_KEY }).bucketExists(process.env.MINIO_BUCKET).then((ok) => process.exit(ok ? 0 : 1), (e) => { console.error(e.code); process.exit(1) })" || { echo "web tak bisa menjangkau bucket dengan kunci aplikasi"; exit 1; }
          # Web read-only: kode tak bisa ditimpa; hanya /tmp dan cache Next (tmpfs) yang bisa ditulis.
          WID="$($C ps -q web)"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$WID")" = "true" || { echo "web bukan read-only"; exit 1; }
          if $C exec -T web sh -c 'echo x > /app/server.js' 2>/dev/null; then echo "kode web bisa ditimpa"; exit 1; fi
          $C exec -T web sh -c 'echo x > /tmp/ci && echo x > /app/.next/cache/ci' || { echo "tmpfs web tak bisa ditulis"; exit 1; }
          # Caddy: cap_drop ALL + NET_BIND_SERVICE saja, tetap bisa bind 80/443 dan melayani (alihkan ke HTTPS).
          $C up -d --no-deps caddy
          CID="$($C ps -q caddy)"
          docker inspect -f '{{.HostConfig.CapDrop}}' "$CID" | grep -q ALL || { echo "caddy tanpa cap_drop ALL"; exit 1; }
          # Docker menuliskannya dengan awalan CAP_ (versi engine berbeda bisa tanpa awalan).
          docker inspect -f '{{.HostConfig.CapAdd}}' "$CID" | grep -Eqx '\[(CAP_)?NET_BIND_SERVICE\]' || { echo "caddy cap_add bukan hanya NET_BIND_SERVICE: $(docker inspect -f '{{.HostConfig.CapAdd}}' "$CID")"; exit 1; }
          for i in $(seq 1 30); do got=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: ci.example.test' http://localhost/ || true); [ "$got" = 308 ] && break; sleep 1; done
          echo "caddy http -> $got"; test "$got" = 308
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' "$CID")" = "true" || { echo "caddy berhenti"; $C logs caddy | tail -30; exit 1; }
          if $C logs caddy | grep -qi "permission denied"; then echo "caddy: permission denied"; $C logs caddy | tail -30; exit 1; fi

      - name: Smoke - auth email dan Google di image produksi
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          $C exec -T web bun -e "
            const base = 'http://localhost:3000/api/v1/auth'
            const post = (path, body) => fetch(base + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
            const get = (path) => fetch(base + path, { redirect: 'manual' })
            const fail = (m) => { console.log('GAGAL:', m); process.exit(1) }
            const reg = { fullName: 'Uji CI', email: 'ci-daftar@example.test', phone: '628111222333', whatsapp: '628111222333', locale: 'id' }
            let r = await post('/register', reg); let j = await r.json()
            if (r.status !== 200 || JSON.stringify(j) !== '{\"success\":true,\"data\":{\"sent\":true}}') fail('register harus {sent:true}, dapat ' + r.status + JSON.stringify(j))
            r = await post('/register', { ...reg, password: 'x' }); if (r.status !== 400) fail('register menerima field password: ' + r.status)
            r = await post('/forgot-password', { email: 'tidak-ada@example.test' }); j = await r.json()
            if (r.status !== 200 || j.data?.sent !== true) fail('forgot-password harus seragam: ' + r.status)
            r = await post('/registration/preview', { token: 'x'.repeat(43) }); if (r.status !== 404) fail('preview token ngawur harus 404: ' + r.status)
            r = await post('/registration/complete', { token: 'x'.repeat(43), password: 'Sandi-Kuat1!', privacyConsent: true, whatsappConsent: true }); if (r.status !== 401) fail('complete token ngawur harus 401: ' + r.status)
            for (const p of ['/verify-phone', '/verify-reset-otp']) { r = await post(p, {}); if (r.status !== 404) fail(p + ' seharusnya sudah tidak ada: ' + r.status) }
            r = await get('/google/start?locale=id'); if (r.status !== 307 || !(r.headers.get('location') ?? '').includes('error=google_unavailable')) fail('google/start tanpa kredensial: ' + r.status + ' ' + r.headers.get('location'))
            r = await get('/google/callback?code=x&state=y'); if (r.status !== 307 || !(r.headers.get('location') ?? '').includes('error=google_failed')) fail('google/callback tanpa cookie state: ' + r.status + ' ' + r.headers.get('location'))
            r = await post('/google/complete', { fullName: 'Uji CI', privacyConsent: true }); if (r.status !== 401) fail('google/complete tanpa cookie harus 401: ' + r.status)
            r = await fetch('http://localhost:3000/id/login'); const html = await r.text(); if (html.includes('href=\"/api/v1/auth/google/start')) fail('tombol Google tampil tanpa kredensial')
            r = await fetch(base + '/contact', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: '628111222333', whatsapp: '628111222333', whatsappConsent: true }) })
            if (r.status !== 401) fail('PUT /auth/contact tanpa sesi harus 401: ' + r.status)
            r = await fetch('http://localhost:3000/api/v1/bookings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
            if (r.status !== 401) fail('POST /bookings tanpa sesi harus 401: ' + r.status)
            r = await fetch('http://localhost:3000/id/lengkapi-data', { redirect: 'manual' }); if (r.status !== 307 || !(r.headers.get('location') ?? '').includes('/id/login')) fail('lengkapi-data tanpa sesi harus ke login: ' + r.status)
            // Webhook WhatsApp (verifikasi nomor): publik, satu-satunya penjaga = tanda tangan HMAC.
            const wh = 'http://localhost:3000/api/v1/webhooks/whatsapp'
            const secret = process.env.WHATSAPP_WEBHOOK_SECRET
            if (!secret) fail('WHATSAPP_WEBHOOK_SECRET tidak ada di container web (skrip env harus membuatnya)')
            const { createHmac } = await import('node:crypto')
            const sign = (b, s) => 'sha256=' + createHmac('sha256', s).update(b).digest('hex')
            const msg = JSON.stringify({ event: 'message', payload: { id: 'x', chat_id: '628111222333@s.whatsapp.net', from: '628111222333@s.whatsapp.net', is_from_me: false, body: 'halo' } })
            r = await fetch(wh, { method: 'POST', body: msg }); if (r.status !== 401) fail('webhook tanpa tanda tangan harus 401: ' + r.status)
            r = await fetch(wh, { method: 'POST', body: msg, headers: { 'X-Hub-Signature-256': sign(msg, 'secret-salah') } }); if (r.status !== 401) fail('webhook tanda tangan salah harus 401: ' + r.status)
            r = await fetch(wh, { method: 'POST', body: msg + ' ', headers: { 'X-Hub-Signature-256': sign(msg, secret) } }); if (r.status !== 401) fail('webhook body diubah setelah ditandatangani harus 401: ' + r.status)
            r = await fetch(wh, { method: 'POST', body: msg, headers: { 'X-Hub-Signature-256': sign(msg, secret) } }); j = await r.json()
            if (r.status !== 200 || j.data?.handled !== false) fail('webhook sah, pesan biasa: harus 200 handled=false, dapat ' + r.status + JSON.stringify(j))
            const ver = JSON.stringify({ event: 'message', payload: { id: 'y', chat_id: '628111222333@s.whatsapp.net', from: '628111222333@s.whatsapp.net', is_from_me: false, body: 'VERIF AAAAAAAA' } })
            r = await fetch(wh, { method: 'POST', body: ver, headers: { 'X-Hub-Signature-256': sign(ver, secret) } }); j = await r.json()
            if (r.status !== 200 || j.data?.handled !== false) fail('kode verifikasi tak dikenal harus 200 handled=false: ' + r.status + JSON.stringify(j))
            r = await fetch('http://localhost:3000/api/v1/auth/whatsapp/verification', { method: 'POST' }); if (r.status !== 401) fail('POST whatsapp/verification tanpa sesi harus 401: ' + r.status)
            console.log('OK: auth email + Google + webhook WhatsApp aman di image produksi')
          "

      # GOWA self-host (docs/rencana-gowa-self-host.md) dengan konfigurasi PRODUKSI: hak minimal, tanpa port, read-only, Basic auth wajib, tak memegang
      # rahasia web, dan jalur yang dipakai lib/whatsapp/client.ts (status, QR = PNG di /statics/qrcode) benar-benar ada di versi yang dipin.
      - name: Smoke - GOWA (WhatsApp gateway) di jaringan internal
        run: |
          C="docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy"
          $C up -d --no-deps gowa
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$($C ps -q gowa)")" = healthy ] && { OK=1; break; }
            sleep 3
          done
          [ "${OK:-0}" = 1 ] || { echo "gowa tidak sehat"; $C logs gowa | tail -40; exit 1; }
          ID="$($C ps -q gowa)"
          test -z "$(docker port "$ID")" || { echo "gowa membuka port: $(docker port "$ID")"; exit 1; }
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$ID")" = true || { echo "gowa bukan read-only"; exit 1; }
          docker inspect -f '{{.HostConfig.CapDrop}}' "$ID" | grep -q ALL || { echo "gowa tanpa cap_drop ALL"; exit 1; }
          docker inspect -f '{{.HostConfig.SecurityOpt}}' "$ID" | grep -q no-new-privileges || { echo "gowa tanpa no-new-privileges"; exit 1; }
          # Proses GOWA berjalan sebagai gowauser (uid 20001), bukan root (entrypoint turun hak lewat su-exec).
          docker top "$ID" -o uid,comm | awk 'NR>1 && $2 ~ /whatsapp/ {print $1}' | grep -qx 20001 || { echo "proses gowa bukan uid 20001"; docker top "$ID" -o uid,comm; exit 1; }
          for K in DATABASE_URL JWT_SECRET PII_ENCRYPTION_KEY RESEND_API_KEY MINIO_SECRET_KEY; do
            test -z "$($C exec -T gowa printenv $K || true)" || { echo "$K terbaca di kontainer gowa"; exit 1; }
          done
          if $C logs gowa | grep -qi "permission denied\|read-only file system"; then echo "gowa: galat izin/berkas"; $C logs gowa | tail -40; exit 1; fi
          # Dari web (klien sungguhan di image produksi): tanpa kredensial 401; dengan kredensial status terbaca & QR = PNG.
          $C exec -T web bun -e "
            const base = process.env.WA_GATEWAY_URL, auth = 'Basic ' + Buffer.from(process.env.WA_GATEWAY_USER + ':' + process.env.WA_GATEWAY_PASSWORD).toString('base64')
            const fail = (m) => { console.log('GAGAL:', m); process.exit(1) }
            if (base !== 'http://gowa:3000') fail('WA_GATEWAY_URL = ' + base)
            let r = await fetch(base + '/app/status'); if (r.status !== 401) fail('tanpa kredensial harus 401: ' + r.status)
            r = await fetch(base + '/app/status', { headers: { Authorization: auth } }); let j = await r.json()
            if (r.status !== 200 || j.results?.is_logged_in !== false) fail('status: ' + r.status + JSON.stringify(j))
            r = await fetch(base + '/app/login', { headers: { Authorization: auth } }); j = await r.json()
            const path = new URL(j.results?.qr_link ?? 'http://x/').pathname
            if (r.status !== 200 || !/^\/statics\/qrcode\/[A-Za-z0-9._-]+\.png$/.test(path)) fail('login: ' + r.status + ' ' + path)
            const img = Buffer.from(await (await fetch(base + path, { headers: { Authorization: auth } })).arrayBuffer())
            if (img[0] !== 0x89 || img.toString('latin1', 1, 4) !== 'PNG') fail('QR bukan PNG')
            console.log('OK: GOWA terjangkau dari web, Basic auth wajib, QR PNG ' + img.length + ' byte')"

      - name: Log layanan (hanya bila gagal)
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy logs --no-color --tail=120

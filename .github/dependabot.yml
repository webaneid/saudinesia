# Update dependency PROAKTIF lewat PR otomatis — pelengkap `bun audit` yang reaktif (CI memblokir Critical).
# Pola mengikuti smart-ai (.github/dependabot.yml). Saudinesia tidak punya branch `develop`, jadi PR ke `main`.
version: 2
updates:
  - package-ecosystem: "npm" # Dependabot belum punya ecosystem "bun" native, tapi membaca package.json/lockfile dengan benar
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Versi yang TERBUKTI merusak runtime produksi (Bun) — jangan diusulkan ulang sampai diverifikasi (docs/lessons-learned.md SEC-05).
    # Selalu uji pada artefak produksi (`bun server.js`): `next build` dan dev tetap lulus untuk kasus-kasus ini.
    ignore:
      - dependency-name: "react"
        versions: [">=19.3.0"] # 19.3.x membuat `next build` crash di internal Bun ("Expected CommonJS module to have a function wrapper")
      - dependency-name: "react-dom"
        versions: [">=19.3.0"]
      - dependency-name: "next-intl"
        update-types: ["version-update:semver-major"] # sudah di 4.x (docs/rencana-next-intl-4.md); mayor berikutnya perlu spike di artefak produksi Bun dulu
      - dependency-name: "use-intl"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"] # disematkan persis sama dengan next-intl (override) — naik bersama next-intl saja
      - dependency-name: "@react-pdf/renderer"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"] # 4.9 menarik @react-pdf/* + pdfkit baru → invoice 500 di produksi (modul `#standard-fonts`)
    groups:
      # Minor/patch digabung jadi 1 PR (kurangi noise); major tetap terpisah per paket — sering breaking change.
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Versi action di workflow (dipin ke tag, bukan SHA — lihat docs/lessons-learned.md SEC-11)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
